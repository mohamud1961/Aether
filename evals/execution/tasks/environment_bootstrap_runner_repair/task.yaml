# v2 design: contract-derived runner command, stale runner and notes, stdlib-only tests that run on any python3 >= 3.9.
id: environment_bootstrap_runner_repair
family: execution
title: Repair a stale test runner against its toolchain contract
summary: Find the runner command the toolchain contract declares, repair the stale runner script so it runs under any python3 3.9 or newer, prove it by running it, and write the repair report and patch list.
timeout_s: 180
network: false
outputs:
  - scripts/run_tests.sh
  - out/toolchain_repair_report.json
  - out/patches_applied.txt
tags:
  - environment
  - toolchain
  - runner-discovery
  - interpreter-portability
  - decoy-files
  - verification
