# v2 design: the audit must be derived from an event log (ordered by seq, with timestamp ties),
# a per-call trace, and a policy file. A summary written for an older SDK is misleading, and
# noise from another session is present. The prompt names the call but does not state any value.
id: runtime_policy_hook
family: execution
title: Runtime policy hook audit
summary: Derive the hook event order and the denial facts for one tool call from the hook event log and trace, ignoring a stale summary and another session's records, and write the audit file.
timeout_s: 60
network: false
outputs:
  - policy_audit.json
tags:
  - environment
  - hooks
  - permissions
  - evidence-derivation
  - decoy-files
