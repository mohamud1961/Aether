# v2 design: exit status and stdout line count must be taken from the process, not from a CI wrapper
# (exit status of tail), a stale green log, planned counts, or merged streams. A fatal line goes to stderr.
id: build_survival_truth
family: execution
title: Report the true state of a failing build
summary: Run a build whose wrapper reports green, and write a report of the process's real terminal state, exit status, crash evidence and stdout line count, separated from the stderr and the planned totals.
timeout_s: 180
network: false
outputs:
  - out/build_report.json
tags:
  - process
  - exit-state
  - stream-separation
  - wrapper-trap
  - verification
