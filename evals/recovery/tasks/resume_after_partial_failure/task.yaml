id: resume_after_partial_failure
family: recovery
title: Resume a crashed data migration without duplicating or losing rows
summary: Finish a batch migration that crashed midway, using its journal and output, so the final dataset is exact, the journal is consistent, and the original input is untouched.
timeout_s: 120
network: false
outputs:
  - data/output/users_v2.jsonl
  - state/migration_journal.jsonl
tags:
  - recovery
  - resume
  - journal
  - data-migration
  - partial-failure
