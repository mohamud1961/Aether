# Rebuild the effective fleet config from a rotated, out-of-order operations log.
id: state_reconstruction_long_log
family: context
title: State reconstruction from a long operations log
summary: Replay a rotated, partly compressed operations log in sequence order across a rollback, then report the exact effective value of every fleet config key and the keys that differ from checkpoint C3. A stale handoff note and a lagging dashboard export are present.
timeout_s: 180
network: false
outputs:
  - out/final_state.json
  - out/changed_since_c3.json
tags:
  - context
  - long-horizon
  - state-reconstruction
  - rotated-logs
  - rollback
