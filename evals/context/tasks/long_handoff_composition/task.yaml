# v2: multi-step handoff chain with a renamed artifact, a stale deprecated publish note, a
# near-duplicate pre-rename decoy with its own hash, and a stale passing verifier record.
id: long_handoff_composition
family: context
title: Long handoff composition
summary: Close a multi-step handoff chain for an artifact that was renamed mid-chain, carry its current identity through every step, ignore the deprecated publish flow and the stale verifier record, and verify the final bytes.
