# New in v2: the agent is the lead. It turns a messy request thread into worker packets and merges results, rejecting a stale one.
id: delegation_fidelity
family: orchestration
title: Delegation fidelity from a messy thread
summary: Turn a request thread with conflicting asks, a retraction and a buried constraint into exact worker packets, then merge the worker results and reject the one built on a superseded packet version.
timeout_s: 180
network: false
outputs:
  - out/packets/ingest.json
  - out/packets/reconcile.json
  - out/packets/writer.json
  - out/merged.json
tags:
  - orchestration
  - delegation
  - retracted-requirement
  - buried-constraint
  - stale-result
  - schema-fidelity
