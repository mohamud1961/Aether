# Ported from the original tool-schema workspace mix pack; v2 adds an append-only snapshot, an env indirection, an archive and a stale cache.
id: tool_schema_workspace_mix
family: tooling
title: Tool-schema workspace mix
summary: Select the open production ticket with the smallest priority from an append-only snapshot (latest event per ticket), resolve the production prefix through the environment config, write the dispatch plan and selector, and ignore the stale cache.
timeout_s: 360
network: false
outputs:
  - out/dispatch_plan.json
  - out/final_submission.json
  - config/active_workspace.txt
tags:
