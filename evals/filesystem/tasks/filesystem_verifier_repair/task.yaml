# v2: layered config resolution, stale docs and archived copies among the decoys.
id: filesystem_verifier_repair
family: filesystem
title: Repair the loaded config target and leave the decoys alone
summary: Follow the boot wrapper to the config the release loads, change one retry value there, ignore the docs snippet and the stale copies, and record a verified submission.
timeout_s: 180
network: false
outputs:
  - app/config/service.yaml
  - out/final_submission.json
  - out/verifier_run.log
tags:
  - filesystem
  - target-selection
  - decoy-files
  - stale-docs
  - verification
  - sentinel
