# v2: draft manifest with extra keys and a stale tracked set, a superseded contract doc that
# describes a file-bytes checksum, and out-of-scope notes that must stay byte-identical.
id: manifest_repair
family: filesystem
title: Bring a draft release directory in line with its contract
summary: Bring a draft release directory in line with the release contract so its manifest, summary and checksum agree, and leave notes and tmp untouched.
timeout_s: 180
network: false
outputs:
  - release/manifest.json
  - release/summary.txt
  - release/checksum.txt
tags:
  - filesystem
  - manifest
  - checksum
  - stale-docs
  - decoy-files
