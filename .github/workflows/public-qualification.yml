name: Public qualification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-public-release:
    name: Cold public release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tracked source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Record exact qualification environment
        run: |
          mkdir -p qualification-receipt
          python -VV > qualification-receipt/python.txt
          python -m pip --version >> qualification-receipt/python.txt
          python -m pip freeze | LC_ALL=C sort > qualification-receipt/environment.txt
          printf 'commit=%s\n' "$GITHUB_SHA" > qualification-receipt/run.txt
          printf 'runner_os=%s\n' "$RUNNER_OS" >> qualification-receipt/run.txt
          printf 'runner_arch=%s\n' "$RUNNER_ARCH" >> qualification-receipt/run.txt
          printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID" >> qualification-receipt/run.txt

      - name: Record current tracked release surface
        run: |
          python tools/release_surface_report.py \
            --json qualification-receipt/release-surface.json \
            --text qualification-receipt/release-surface.txt
          cat qualification-receipt/release-surface.txt

      - name: Record static production import graph
        run: |
          python tools/runtime_surface_report.py \
            --json qualification-receipt/runtime-surface.json \
            --text qualification-receipt/runtime-surface.txt
          cat qualification-receipt/runtime-surface.txt

      - name: Build and verify distributable wheel
        run: |
          mkdir -p qualification-receipt/wheel
          python -m pip wheel . --no-deps -w qualification-receipt/wheel
          WHEEL="$(find qualification-receipt/wheel -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python tools/wheel_surface_report.py "$WHEEL" \
            --json qualification-receipt/wheel-surface.json \
            --text qualification-receipt/wheel-surface.txt
          cat qualification-receipt/wheel-surface.txt
          rm -rf /tmp/aether-wheel-install
          python -m pip install --no-deps --target /tmp/aether-wheel-install "$WHEEL"
          (
            cd /tmp
            PYTHONPATH=/tmp/aether-wheel-install python -c "import aether, aether.launch, aether.harbor_agent; import importlib.metadata as m; assert m.version('aether-runtime') == '0.3.0'; print('AETHER_WHEEL_IMPORT_OK', aether.__file__)"
          )
          rm -rf /tmp/aether-wheel-install

      - name: Verify tracked-files-only public release
        run: python tools/cold_verify_public_release.py

      - name: Upload qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-receipt-${{ github.sha }}
          path: qualification-receipt/
          if-no-files-found: error
          retention-days: 30
