name: Public qualification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-public-release:
    name: Cold public release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tracked source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Verify tracked-files-only public release
        run: python tools/cold_verify_public_release.py
