worker_processes  1;
error_log  /app/run/nginx-error.log info;
pid        /app/run/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /app/run/nginx-access.log;
  server {
    listen 80;
    server_name _;
    root /app/www;
    index index.html;
    location / { try_files $uri $uri/ =404; }
  }
}
