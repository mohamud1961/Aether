[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.6.0"
description = "Aether: an agent harness, the evaluations that measure it, and the research behind it."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pyyaml>=6", "openai>=2.30,<3", "httpx>=0.27", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
inspect = ["inspect-ai==0.3.279"]
vision = ["opencv-python-headless>=4.9", "numpy>=1.26", "Pillow>=11,<13"]
harbor = ["harbor==0.20.0"]

[project.scripts]
harness-evals = "harness_evals.cli:main"

[tool.setuptools.packages.find]
include = ["aether*", "harness_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
