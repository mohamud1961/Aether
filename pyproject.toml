[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-runtime"
version = "0.3.0"
description = "Aether PCR runtime and Harbor adapter"
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "litellm",
    "pymupdf",
    "pyyaml",
    "rapidocr-onnxruntime",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
test = ["pytest"]
harbor = ["harbor==0.20.0"]

[project.scripts]
aether = "aether.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]

[tool.setuptools.package-data]
aether = ["harbor_runtime_lock.json", "launch_schema.json", "harbor_subreaper_linux_x86_64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
