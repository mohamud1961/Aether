[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.4.0.dev0"
description = "Aether: an agent harness, the evaluations that measure it, and the research behind it."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pyyaml>=6", "openai>=1.40", "httpx>=0.27", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["opencv-python-headless>=4.9", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
