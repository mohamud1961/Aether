# Python project config for harnesseng
# Dependencies: litellm, docker, pytest

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "Public HarnessEng package exposing the canonical harness.aether2 namespace and runner.aether2 compatibility"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "docker",
    "pytest",
    "pyyaml",
    "pypdf",
]

[tool.setuptools.packages.find]
include = ["aether*", "harness*", "runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
