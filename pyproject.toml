[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.0.0"
description = "Aether: an agent harness, the evaluations that measure it, and the research behind it."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = []

[tool.pytest.ini_options]
testpaths = ["tests"]
