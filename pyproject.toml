# Python project config for HarnessEng
# Runtime dependencies: litellm (Azure model routing), pyyaml (eval/board manifests)

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-aether2"
version = "0.1.0"
description = "HarnessEng: an eval-first agentic harness exposing the harness.aether2 runtime"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "pymupdf",
    "pyyaml",
    "rapidocr-onnxruntime",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["harness*", "aether*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
