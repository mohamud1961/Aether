[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aether-core"
version = "0.1.0"
description = "A recorded, model-directed agent runtime for Linux task sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai>=2.30,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
harbor = ["harbor==0.20.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
