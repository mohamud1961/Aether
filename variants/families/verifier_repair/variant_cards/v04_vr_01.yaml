variant_id: v04_vr_01_verifier_episode_parser
block_family: VerificationBlock
block_interface: VerificationBlock.check(task, workspace_state) -> verified: bool
source_from_deep_synthesis:
  anchors:
    - claim_ref: mm.w03.artifact_backed_postcondition_proof
      source: research/synthesis/mechanism-map.md
    - claim_ref: ft.w02.verifier_completion_vs_final_acceptance_divergence
      source: research/synthesis/failure-taxonomy.md
    - claim_ref: vfs.w02.vf_pc_02_layered_acceptance_survives
      source: research/phases/variant_family_seeds/synthesis/README.md
observed_trace_or_eval_evidence:
  - Phase 4 single-family closeout: verifier_episode_parser passed all rows in the Phase 4
    eval — but the eval was classified as non-discriminating (too easy). The passing result
    means the mechanism is not harmful; it does not establish that it adds value on hard tasks
    (verifier_repair/README.md; hypothesis.md Grounding §1).
  - Root cause addressed: identifying when the verifier episode has genuinely failed vs. when
    it has simply not yet run — the parser reads stdout/exit pattern rather than relying on
    harness-level exit codes (hypothesis.md Grounding §2).
mechanism_claim: parse the verifier episode structure (stdout pattern, exit code, re-run
  eligibility) to correctly detect when a verification episode has genuinely failed vs.
  when it has not yet run, enabling targeted re-trigger of the verification episode.
target_failure: verifier_false_fail_on_fixable_state
anti_benchmarkifying_risk: if the eval surface is not discriminating enough, the mechanism
  will appear to win without providing real uplift (Phase 4 confirmed this risk).
expected_improvement: reduced false-fail outcomes on tasks where verifier exit is caused by
  a fixable state (wrong path, missed re-run) rather than genuine task failure.
expected_failure_mode: over-aggressive re-triggering may mask genuine failures or cause
  runaway re-run loops on truly failed tasks.
complexity_cost: medium (stdout/exit pattern parser with re-trigger logic).
token_cost_expectation: low; parser is deterministic and adds minimal overhead.
changed_files:
  - variants/families/verifier_repair/code/verifier_episode_parser.py
hypothesis_status: retest_required
eval_status: phase4_non_discriminating
promotion_threshold: harder, more varied eval surface (expand homolog pressure per Phase 4
  recommendation); named regression sentinels not trivially passed; preregistered prediction;
  certified backend.
retirement_condition: retire if no lift on a discriminating eval, or if re-trigger logic
  masks genuine failures (false-clean rate increases).
bounded_claims:
  - Phase 4 pass result is NOT a promotion claim (non-discriminating eval)
  - no promotion without a harder eval surface and certified backend
