variant_id: v04_ow_01_open_workflow_path_evidence_normalization
block_family: ToolBlock
block_interface: ToolBlock.execute_tool_call(tool_call, sandbox) -> result
source_from_deep_synthesis:
  anchors:
    - claim_ref: mm.w05.cwd_workdir_path_contract
      source: research/synthesis/mechanism-map.md
    - claim_ref: mm.w04.explicit_artifact_continuity_workspace_state
      source: research/synthesis/mechanism-map.md
    - claim_ref: ft.w03.workspace_repo_branch_path_drift
      source: research/synthesis/failure-taxonomy.md
    - claim_ref: vfs.w02.vf_pc_04_workspace_path_contract_bounded
      source: research/phases/variant_family_seeds/synthesis/README.md
observed_trace_or_eval_evidence:
  - Phase 5 family-level diagnostic: filesystem/cwd cluster scored 0/6 on target rows.
    Root causes included wrong cwd/root and wrong target-file pattern matching
    (decision_history.md Phase 5; hypothesis.md Grounding §1).
  - Phase 4 single-family closeout: both open-workflow routes failed target rows entirely;
    classified as "target uplift non-existent" — not a sentinel regression but a complete
    failure to move target rows (hypothesis.md Grounding §2).
  - Mechanism addresses open-workflow answer candidate normalization (what the agent
    reports as the answer), distinct from cwd/target-path invariants during execution
    (hypothesis.md Grounding §3).
mechanism_claim: normalize /app and open-workflow paths in tool-call results and rewrite
  artifact evidence paths so the answer-candidate layer receives consistent path evidence,
  reducing wrong-file submissions on open-file tasks.
target_failure: wrong_file_submission_on_open_workflow_task
anti_benchmarkifying_risk: normalizer may over-generalize and strip valid path evidence for
  tasks where exact path specificity is required.
expected_improvement: reduced wrong-file submissions on open-file tasks where path evidence
  is noisy, aliased, or partially-qualified.
expected_failure_mode: path normalizer may strip valid exact-path evidence required on tasks
  where specificity is the grading criterion.
complexity_cost: medium (path-rewriting pipeline across answer-candidate and dispatch layers).
token_cost_expectation: low to negligible; path normalization may reduce prompt noise.
changed_files:
  - variants/families/filesystem_open_workflow/code/app_open_workflow_path_evidence_normalizer.py
  - variants/families/filesystem_open_workflow/code/open_workflow_answer_candidate_dispatch.py
  - variants/families/filesystem_open_workflow/code/open_workflow_answer_candidate_normalizer.py
hypothesis_status: blocked_pending_eval_substrate
eval_status: no_eval_run_since_phase4
promotion_threshold: valid eval baseline on open-workflow target rows with certified backend;
  named regression sentinels from at least one other family; preregistered prediction delta.
retirement_condition: retire if path normalization provides no lift on a valid discriminating
  eval or if the mechanism worsens exact-path-match precision.
bounded_claims:
  - bounded to open-workflow answer-candidate layer only
  - no promotion claim without a valid eval baseline (Phase 4 result was "target uplift
    non-existent" — not a starting point for promotion)
