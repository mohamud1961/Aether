mechanism_claim: block tool calls that lack identity verification before execution, reducing
  no-call attribution errors where the harness incorrectly attributes results to unexecuted
  tool invocations.
target_failure: no_call_attribution_error
anti_benchmarkifying_risk: guard may overfit to the no-call pattern in the two target tasks
  while missing novel no-call scenarios.
expected_improvement: 0→1 on ctc_semantics_002 (confirmed); sentinel stable. One target row
  remains at fail — not a full solve.
expected_failure_mode: over-blocking may reject valid tool calls in edge cases where identity
  is ambiguous at call time.
complexity_cost: low (pre-execution identity check on each tool call).
token_cost_expectation: small reduction (fewer model calls per clean path per prediction.json).
changed_files:
  - variants/families/attribution_guard_tournament/code/no_call_attribution_guard.py
tournament_result:
