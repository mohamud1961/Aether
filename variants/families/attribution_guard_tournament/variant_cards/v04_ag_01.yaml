  target_total: 2
  sentinel_pass: 1
  sentinel_total: 1
  contamination_status: clean
  decision: keep_for_follow_up
eval_status: tournament_complete_azure_vm_docker_20260517
promotion_threshold: requires resolution of the remaining target failure and a broader
  sentinel sweep before promotion. Sentinel-safe but not a full-target solve.
retirement_condition: retire if the 1/2 target lift does not replicate on a fresh certified
  run, or if broader sentinels reveal regressions.
bounded_claims:
