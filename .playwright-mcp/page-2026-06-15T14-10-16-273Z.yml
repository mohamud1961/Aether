              - paragraph [ref=f1e21]:
                - strong [ref=f1e22]: About Gruve
              - paragraph [ref=f1e23]: Gruve is an innovative software services startup dedicated to transforming enterprises to AI powerhouses. We specialize in cybersecurity, customer experience, cloud infrastructure, and advanced technologies such as Large Language Models (LLMs). Our mission is to assist our customers in their business strategies utilizing their data to make more intelligent decisions. As a well-funded early-stage startup, Gruve offers a dynamic environment with strong customer and partner networks.
            - generic [ref=f1e24]:
              - paragraph [ref=f1e25]:
                - strong [ref=f1e26]: About the Role
              - paragraph [ref=f1e27]:
                - text: We are looking for a highly creative and technically strong Vibe-Coding Engineer who can rapidly transform ideas into working prototypes using AI-assisted development tools. This role is ideal for engineers passionate about GenAI, rapid prototyping, AI coding agents, product experimentation, and modern developer tooling.
                - text: You will work closely with product, design, and engineering teams to quickly build proof-of-concepts, internal tools, AI workflows, and next-generation user experiences using tools like Cursor, Claude Code, Copilot, MCP servers, and modern full-stack frameworks.
              - paragraph [ref=f1e28]:
                - strong [ref=f1e29]: Key Responsibilities
              - list [ref=f1e30]:
                - listitem [ref=f1e31]: Rapidly prototype applications using AI-assisted coding tools
                - listitem [ref=f1e32]: Build and iterate on LLM-powered applications and workflows
                - listitem [ref=f1e33]: Use tools like Cursor, Claude Code, GitHub Copilot, Windsurf, Replit AI, etc.
                - listitem [ref=f1e34]: Design and integrate MCP servers, APIs, and AI agents
                - listitem [ref=f1e35]: Develop lightweight full-stack applications using modern frameworks
                - listitem [ref=f1e36]: Experiment with prompts, workflows, and AI orchestration patterns
                - listitem [ref=f1e37]: Collaborate with product and UX teams to turn ideas into demos quickly
                - listitem [ref=f1e38]: Optimize developer productivity through automation and AI tooling
                - listitem [ref=f1e39]: Stay current with emerging AI engineering trends and frameworks
              - paragraph [ref=f1e40]:
                - strong [ref=f1e41]: Basic Qualification
              - list [ref=f1e51]:
                - listitem [ref=f1e52]: Looking for candidates with 1–3 years of experience and strong expertise in LLMs and RAG
                - listitem [ref=f1e53]: Strong programming skills in Python, JavaScript/TypeScript, Golang, or Node.js
                - listitem [ref=f1e54]: Experience with React/Next.js, REST APIs, microservices, and Git/GitHub
                - listitem [ref=f1e55]: Hands-on experience with Cursor, Claude Code, GitHub Copilot, and ChatGPT
                - listitem [ref=f1e56]: Strong understanding of LLMs, RAG architectures, prompt engineering, AI agents, and MCP
              - paragraph [ref=f1e57]:
                - strong [ref=f1e58]: Preferred Qualification
              - list [ref=f1e59]:
                - listitem [ref=f1e60]: Experience building GenAI applications
                - listitem [ref=f1e61]: Familiarity with vector databases and embeddings
                - listitem [ref=f1e62]: Exposure to LangChain, LangGraph, CrewAI, AutoGen, or similar frameworks
                - listitem [ref=f1e63]: Knowledge of Docker, Kubernetes, and cloud platforms (AWS/Azure/GCP)
                - listitem [ref=f1e64]: Experience integrating enterprise systems with AI workflows
                - listitem [ref=f1e65]: Strong product intuition and rapid experimentation mindset
              - paragraph [ref=f1e66]:
